---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - argoproj.io
  resources:
  - clustersets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - clustersets/finalizers
  verbs:
  - update
- apiGroups:
  - argoproj.io
  resources:
  - clustersets/status
  verbs:
  - get
  - patch
  - update
